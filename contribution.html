<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Contribution</title>
</head>
<body>
    <h1>Team Contribution</h1>

    <button id="load-contributor">Show Contributor</button>
    <p id="contributor-student-id"></p>

    <a href="index.html">Back to Task Manager</a>

    <script>
        document.getElementById("load-contributor").onclick = async function() {
            const response = await fetch("contribution.json");
            const data = await response.json();

            document.getElementById("contributor-student-id").textContent =
                "Contributor Student ID: " + data.contributorStudentId;
        };
    </script>
</body>
</html>
